<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deobfuscator — меню</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --line:#30363d;
    --text:#c9d1d9; --dim:#8b949e; --accent:#58a6ff; --green:#3fb950;
    --warn:#d29922; --red:#f85149; --console:#010409;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--bg); color:var(--text);
    font:14px/1.45 "Segoe UI", system-ui, sans-serif;
    display:flex; flex-direction:column;
  }
  header {
    display:flex; align-items:center; gap:12px; padding:8px 14px;
    background:var(--panel); border-bottom:1px solid var(--line);
  }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .sub { color:var(--dim); font-size:12px; }
  #conn { width:9px; height:9px; border-radius:50%; background:var(--warn); flex:none; }
  #conn.ok { background:var(--green); }
  #conn.err { background:var(--red); }
  main { flex:1; display:flex; min-height:0; }
  .col {
    display:flex; flex-direction:column; min-height:0;
    border-right:1px solid var(--line);
  }
  .col-head {
    padding:7px 12px; font-size:12px; letter-spacing:.04em; text-transform:uppercase;
    color:var(--dim); background:var(--panel2); border-bottom:1px solid var(--line);
    flex:none; display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  .col-body { flex:1; overflow:auto; padding:10px 12px; }
  #col-browse { width:280px; flex:none; }
  #col-settings { width:330px; flex:none; }
  #col-right { flex:1; }

  /* --- browse --- */
  #crumbs {
    display:block; width:100%; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:6px; padding:5px 8px;
    font-size:12px; margin-bottom:8px;
  }
  .ent {
    display:flex; align-items:center; gap:8px; padding:4px 6px; border-radius:6px;
    cursor:pointer; white-space:nowrap;
  }
  .ent:hover { background:var(--panel2); }
  .ent .nm { overflow:hidden; text-overflow:ellipsis; }
  .ent.dir .ic { color:var(--warn); }
  .ent.lua .ic { color:var(--green); }
  .ent button { margin-left:auto; flex:none; }
  button.mini {
    background:var(--panel2); color:var(--dim); border:1px solid var(--line);
    border-radius:5px; padding:1px 6px; font-size:11px; cursor:pointer;
  }
  button.mini:hover { color:var(--text); border-color:var(--accent); }
  .sel {
    margin-top:10px; border-top:1px solid var(--line); padding-top:8px;
  }
  .sel-item {
    display:flex; align-items:center; gap:6px; padding:3px 2px;
    font-size:12px; word-break:break-all;
  }
  .sel-item .x { color:var(--dim); cursor:pointer; flex:none; }
  .sel-item .x:hover { color:var(--red); }
  .hint { color:var(--dim); font-size:12px; margin:6px 0; }

  /* --- settings --- */
  .sect { margin-bottom:14px; }
  .sect h3 {
    font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--accent);
    margin:0 0 8px; border-bottom:1px dashed var(--line); padding-bottom:4px;
  }
  .row { display:flex; align-items:center; gap:8px; margin:5px 0; flex-wrap:wrap; }
  .row label { color:var(--dim); font-size:12px; min-width:120px; }
  .row input[type=number], .row input[type=text], .row select {
    flex:1; min-width:0; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:6px; padding:5px 8px; font-size:13px;
  }
  .row input[type=checkbox] { accent-color:var(--accent); width:16px; height:16px; }
  .row input[type=text] { width:100%; }
  .toggles { display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; margin-top:4px; }
  .tog { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text); }
  .tog input { margin:0; }
  .btn {
    background:var(--accent); color:#04121f; border:none; border-radius:6px;
    padding:8px 16px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .btn:hover { filter:brightness(1.1); }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.ghost { background:var(--panel2); color:var(--text); border:1px solid var(--line); font-weight:500; }
  .btn.ghost:hover { border-color:var(--accent); }
  .btn.danger { background:var(--red); color:#fff; }
  .btnrow { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  #cmdline {
    width:100%; background:var(--console); color:var(--accent); border:1px solid var(--line);
    border-radius:6px; padding:7px; font:12px Consolas, monospace; margin-top:8px;
    word-break:break-all; display:none;
  }

  /* --- right: jobs + console --- */
  #jobs { flex:none; border-bottom:1px solid var(--line); background:var(--panel); }
  .job {
    display:flex; align-items:center; gap:8px; padding:5px 12px; cursor:pointer;
    font-size:12px; border-left:3px solid transparent;
  }
  .job:hover { background:var(--panel2); }
  .job.active { border-left-color:var(--accent); background:var(--panel2); }
  .job .st { font-size:10px; padding:1px 7px; border-radius:10px; flex:none; font-weight:600; }
  .st.running { background:#1f3a5f; color:var(--accent); }
  .st.done { background:#123019; color:var(--green); }
  .st.error, .st.no-file { background:#3a1618; color:var(--red); }
  .st.cancelled { background:#3a2e12; color:var(--warn); }
  .job .cn { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--dim); }
  .job .res { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--green); max-width:45%; }
  #console-wrap { flex:1; display:flex; flex-direction:column; min-height:0; }
  #console {
    flex:1; overflow:auto; background:var(--console); color:#e6edf3;
    font:12px/1.45 Consolas, "Cascadia Mono", monospace; padding:10px 12px; white-space:pre-wrap;
    word-break:break-all; margin:0;
  }
  #console .line-by { color:var(--dim); }
  #console .l-star { color:var(--accent); }
  #console .l-plus { color:var(--green); }
  #console .l-bang { color:var(--red); }
  #console .l-shell { color:var(--warn); }
  #console .l-gear { color:var(--dim); }
  #console .l-raw { color:#e6edf3; }
  #console.autoscroll { }
  .conbar {
    display:flex; align-items:center; gap:10px; padding:6px 12px; flex:none;
    background:var(--panel2); border-top:1px solid var(--line); font-size:12px; color:var(--dim);
  }
  .conbar .spacer { flex:1; }
  #result-line { color:var(--green); word-break:break-all; font-size:12px; }
  #result-line a { color:var(--green); }
  .badge { padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; }
  .b-running { background:#1f3a5f; color:var(--accent); }
  .b-done { background:#123019; color:var(--green); }
  .b-error { background:#3a1618; color:var(--red); }
  .b-cancelled { background:#3a2e12; color:var(--warn); }
  .muted { color:var(--dim); }
  .empty { color:var(--dim); font-size:12px; padding:14px; }
</style>
</head>
<body>
<header>
  <span id="conn"></span>
  <h1>Deobfuscator — панель управления</h1>
  <span class="sub">Luraph v14/v15 + общие обфускаторы · локальный сервер</span>
  <span style="flex:1"></span>
  <button class="btn ghost" onclick="copyCommand()">Копировать команду</button>
  <button class="btn ghost" onclick="openResultFolder()">Открыть папку результата</button>
</header>

<main>
  <div id="col-browse" class="col">
    <div class="col-head">
      <span>Исходные файлы</span>
      <span style="display:flex;gap:6px">
        <button class="mini" title="Системный диалог выбора файлов (Windows)" onclick="pickNativeFiles()">Файлы…</button>
        <button class="mini" title="Системный диалог выбора папки (Windows)" onclick="pickNativeDir()">Папка…</button>
      </span>
    </div>
    <div class="col-body">
      <div class="hint">Место:</div>
      <input id="crumbs" spellcheck="false" value="D:\Downloads">
      <div id="drive-tabs"></div>
      <div id="entries"></div>

      <div class="sel">
        <div class="hint">Выбрано (для деобфускации):</div>
        <div id="sel-list"></div>
        <div class="btnrow">
          <button class="btn ghost" onclick="addCurrentDir()">Добавить этот каталог</button>
          <button class="btn ghost" onclick="clearSelection()">Очистить</button>
          <button class="btn ghost" onclick="addSample()">sample (тесты)</button>
          <button class="btn ghost" onclick="pickBrowser()">Браузер…</button>
        </div>
      </div>

      <div class="sect" style="margin-top:14px">
        <h3>Вставить текст вместо файла</h3>
        <textarea id="input-text" style="width:100%;height:56px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px;font:12px Consolas,monospace;resize:vertical" placeholder="(необязательно) исходный код напрямую — требуется минимум один файл либо каталог"></textarea>
      </div>
    </div>
  </div>

  <div id="col-settings" class="col">
    <div class="col-head">Настройки</div>
    <div class="col-body">
      <div class="sect">
        <h3>Пресеты</h3>
        <div class="row">
          <select id="preset" onchange="applyPreset(this.value)">
            <option value="quick">Быстрый</option>
            <option value="deep14">Глубокий v14</option>
            <option value="max">Максимум</option>
            <option value="custom">Свой</option>
          </select>
        </div>
        <div class="btnrow">
          <button class="btn ghost" onclick="saveSettings()">Сохранить</button>
          <button class="btn ghost" onclick="resetSettings()">Сброс</button>
        </div>
      </div>

      <div class="sect">
        <h3>Обработка (deob.js)</h3>
        <div class="row"><label>timeout, сек</label><input type="number" id="s-timeout" min="1" value="90"></div>
        <div class="row"><label>budget, сек</label><input type="number" id="s-budget" min="1" value="30"></div>
        <div class="row"><label>max-runs</label><input type="number" id="s-maxRuns" min="1" value="12"></div>
        <div class="row"><label>jobs (параллельно)</label><input type="number" id="s-jobs" min="1" value="1"></div>
        <div class="row"><label>devirt-rounds</label><input type="number" id="s-devirtRounds" min="1" value="200"></div>
        <div class="row"><label>executor</label><input type="text" id="s-executor" value="Wave"></div>
        <div class="toggles">
          <label class="tog"><input type="checkbox" id="s-noDevirt"> без devirt</label>
          <label class="tog"><input type="checkbox" id="s-noHooks"> без хуков</label>
          <label class="tog"><input type="checkbox" id="s-noFold"> без fold</label>
          <label class="tog"><input type="checkbox" id="s-strings"> декодер строк</label>
          <label class="tog"><input type="checkbox" id="s-keepHarness"> keep harness</label>
          <label class="tog"><input type="checkbox" id="s-keepPreamble"> keep preamble</label>
          <label class="tog"><input type="checkbox" id="s-debug"> debug (файлы в выводе)</label>
          <label class="tog"><input type="checkbox" id="s-detect"> только определить</label>
        </div>
        <div class="row" style="margin-top:8px"><label>Выходной файл (-o)</label><input type="text" id="s-output" placeholder="(пусто = output/ рядом с файлом)"></div>
      </div>

      <div class="sect">
        <h3>Глубокая машина v14 (env)</h3>
        <label class="tog" style="margin-bottom:6px;display:flex"><input type="checkbox" id="s-v14Deep"> DEOB_V14_DEEP — лифтить функции VM</label>
        <div class="row"><label>decode budget</label><input type="number" id="s-v14Budget" min="1" placeholder="300"></div>
        <div class="row"><label>chunk min (перехват)</label><input type="number" id="s-chunkMin" min="1" placeholder="512"></div>
        <div class="row"><label>spin (лимит циклов)</label><input type="number" id="s-deobSpin" min="1" placeholder="авто"></div>
        <div class="row"><label>pipeline timeout, сек</label><input type="number" id="s-pipelineTimeout" min="1" placeholder="авто"></div>
        <div class="toggles">
          <label class="tog"><input type="checkbox" id="s-spinLate"> spin позже</label>
          <label class="tog"><input type="checkbox" id="s-dumpTrace"> dump trace</label>
          <label class="tog"><input type="checkbox" id="s-debugPartial"> debug partial</label>
        </div>
      </div>

      <div class="btnrow" style="margin-top:12px">
        <button class="btn" id="btn-run" onclick="startRun()">Запустить</button>
        <button class="btn danger" onclick="cancelActive()">Остановить</button>
      </div>
      <div id="cmdline"></div>
    </div>
  </div>

  <div id="col-right" class="col">
    <div id="jobs" class="col-head" style="justify-content:flex-start;gap:10px">
      <div style="display:flex;align-items:center;gap:8px;flex:1">
        <span>Запуски</span>
        <span id="job-count" class="muted"></span>
      </div>
    </div>
    <div id="joblist"></div>
    <div id="console-wrap">
      <div class="conbar">
        <span id="active-name" class="muted">нет активного задания</span>
        <span id="state-badge"></span>
        <span class="spacer"></span>
        <label class="tog" style="color:var(--dim)"><input type="checkbox" id="autoscroll" checked> автоскролл</label>
        <button class="mini" onclick="clearConsole()">очистить</button>
      </div>
      <pre id="console"></pre>
    </div>
  </div>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const API = '';
const state = { inputs: [], active: null, es: null, seen: {} };
let lastJobLines = 0;
let firstEverLine = true;
let connState = null;

/* ---------------- сервер ---------------- */

function conn(bool) {
  $('conn').className = bool ? 'ok' : (typeof bool === 'string' ? bool : 'err');
}
fetch(API + '/api/roots').then(r => r.json()).then(o => {
  conn(true);
  const t = $('drive-tabs');
  t.innerHTML = '';
  for (const r of o.roots) {
    const b = document.createElement('button');
    b.className = 'mini';
    b.textContent = r.name;
    b.style.marginRight = '6px';
    b.style.marginBottom = '6px';
    b.style.cursor = 'pointer';
    b.onclick = () => { $('crumbs').value = r.path; browse(); };
    t.appendChild(b);
  }
  const saved = localStorage.getItem('dex_crumbs');
  if (saved) { $('crumbs').value = saved; }
  browse();
}).catch(e => conn('err') || console.error(e));

async function browse() {
  const p = $('crumbs').value;
  localStorage.setItem('dex_crumbs', p);
  $('#entries').innerHTML = '<div class="hint">загрузка…</div>';
  try {
    const r = await fetch(API + '/api/browse?p=' + encodeURIComponent(p));
    const o = await r.json();
    if (o.error) { $('#entries').innerHTML = '<div class="hint">' + o.error + '</div>'; return; }
    renderEntries(o.dir);
  } catch (e) { $('#entries').innerHTML = '<div class="hint">ошибка: ' + e + '</div>'; }
}

function renderEntries(d) {
  const box = $('#entries');
  box.innerHTML = '';
  const up = { name: '… вверх', path: d.root.split(/[\\/]/).slice(0, -1).join('/') + (d.root.split(/[\\/]/).length > 2 ? '/' : ''), dir: true };
  const rootIs = d.root.split(/[\\/]/).filter(Boolean).length;
  if (rootIs > 1) {
    const u = mkEnt({ name: '.. (вверх)', path: d.root.replace(/[\\/]+[^\\/]*$/, ''), dir: true, ext: null, lua: false, size: 0, mtime: 0 });
    box.appendChild(u);
  }
  for (const e of d.entries) box.appendChild(mkEnt(e));
}

function mkEnt(e) {
  const div = document.createElement('div');
  div.className = 'ent' + (e.dir ? ' dir' : (e.lua ? ' lua' : ''));
  const ic = document.createElement('span');
  ic.className = 'ic';
  ic.textContent = e.dir ? '▸' : (e.lua ? '📜' : '·');
  const nm = document.createElement('span');
  nm.className = 'nm';
  nm.textContent = e.dir ? e.name : e.name + '  ' + fmtSize(e.size);
  div.appendChild(ic); div.appendChild(nm);
  if (e.dir) {
    div.onclick = () => { $('crumbs').value = e.path; browse(); };
  } else if (e.lua) {
    div.onclick = () => addInput(e.path);
    const b = document.createElement('button');
    b.className = 'mini';
    b.textContent = '+';
    b.onclick = (ev) => { ev.stopPropagation(); addInput(e.path); };
    div.appendChild(b);
  }
  return div;
}

function fmtSize(n) { return n >= 1048576 ? (n/1048576).toFixed(1)+' МБ' : n >= 1024 ? (n/1024).toFixed(0)+' КБ' : n+' Б'; }

function addInput(p) {
  if (!state.inputs.includes(p)) { state.inputs.push(p); renderSel(); }
}
function clearSelection() { state.inputs = []; renderSel(); }
function addCurrentDir() {
  const d = $('crumbs').value;
  if (!state.inputs.includes(d)) { state.inputs.push(d); renderSel(); }
}
function addSample() {
  const p = 'D:\\Downloads\\best\\Deobfuscator-Luraph-V15-master\\sample';
  addInput(p);
  $('crumbs').value = p; browse();
}
function renderSel() {
  const box = $('#sel-list');
  box.innerHTML = '';
  if (!state.inputs.length) { box.innerHTML = '<div class="hint">пусто</div>'; return; }
  state.inputs.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'sel-item';
    const x = document.createElement('span');
    x.className = 'x'; x.textContent = '✕';
    x.onclick = () => { state.inputs.splice(i, 1); renderSel(); };
    d.appendChild(x);
    d.appendChild(document.createTextNode(p));
    box.appendChild(d);
  });
}

/* ---------------- настройки ---------------- */

function collectSettings() {
  const g = (id) => {
    const el = $(id); if (!el) return undefined;
    if (el.type === 'checkbox') return el.checked;
    if (el.type === 'number') { const v = Number(el.value); return Number.isFinite(v) && el.value !== '' ? v : undefined; }
    return el.value.trim() === '' ? undefined : el.value.trim();
  };
  return {
    inputs: state.inputs,
    inputText: g('input-text'),
    timeout: g('s-timeout'), budget: g('s-budget'), maxRuns: g('s-maxRuns'),
    jobs: g('s-jobs'), devirtRounds: g('s-devirtRounds'), executor: g('s-executor'),
    noDevirt: g('s-noDevirt'), noHooks: g('s-noHooks'), noFold: g('s-noFold'),
    strings: g('s-strings'), keepHarness: g('s-keepHarness'), keepPreamble: g('s-keepPreamble'),
    debug: g('s-debug'), detect: g('s-detect'), output: g('s-output'),
    v14Deep: g('s-v14Deep'), v14Budget: g('s-v14Budget'), chunkMin: g('s-chunkMin'),
    deobSpin: g('s-deobSpin'), pipelineTimeout: g('s-pipelineTimeout'),
    spinLate: g('s-spinLate'), dumpTrace: g('s-dumpTrace'), debugPartial: g('s-debugPartial'),
  };
}

const PRESETS = {
  quick: {
    timeout: 90, budget: 30, maxRuns: 12, jobs: 1, devirtRounds: 200, executor: 'Wave',
    noDevirt: false, noHooks: false, noFold: false, strings: false,
    keepHarness: false, keepPreamble: false, debug: false, detect: false,
    v14Deep: false, spinLate: false, dumpTrace: false, debugPartial: false,
  },
  deep14: {
    timeout: 600, budget: 600, maxRuns: 24, jobs: 2, devirtRounds: 400, executor: 'Wave',
    noDevirt: false, noHooks: false, noFold: false, strings: true,
    keepHarness: false, keepPreamble: false, debug: true, detect: false,
    v14Deep: true, v14Budget: 1200, pipelineTimeout: 3600, spinLate: false, dumpTrace: false, debugPartial: false,
  },
  max: {
    timeout: 1800, budget: 1800, maxRuns: 48, jobs: 4, devirtRounds: 800, executor: 'Wave',
    noDevirt: false, noHooks: false, noFold: false, strings: true,
    keepHarness: false, keepPreamble: false, debug: true, detect: false,
    v14Deep: true, v14Budget: 4000, chunkMin: 512, deobSpin: 4096, pipelineTimeout: 7200,
    spinLate: false, dumpTrace: true, debugPartial: false,
  },
};

function applyPreset(name) {
  const p = PRESETS[name];
  if (!p) return;
  for (const [k, v] of Object.entries(p)) {
    const el = $('s-' + k); if (!el) continue;
    if (el.type === 'checkbox') el.checked = !!v;
    else if (el.type === 'number') el.value = v === undefined ? '' : v;
    else el.value = v === undefined ? '' : v;
  }
}

function saveSettings() {
  const s = collectSettings();
  delete s.inputs; delete s.inputText;
  localStorage.setItem('dex_settings', JSON.stringify(s));
  $('cmdline').style.display = 'none';
}
function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('dex_settings') || '{}');
    for (const [k, v] of Object.entries(s)) {
      const el = $('s-' + k); if (!el) continue;
      if (el.type === 'checkbox') el.checked = !!v;
      else if (el.type === 'number') el.value = v === undefined || v === null ? '' : String(v);
      else el.value = v === undefined || v === null ? '' : String(v);
    }
  } catch {}
}
function resetSettings() {
  localStorage.removeItem('dex_settings');
  applyPreset('quick');
}
loadSettings();

/* ---------------- выбор файлов ---------------- */

async function pickNativeFiles() {
  const r = await fetch(API + '/api/pick');
  const o = await r.json();
  if (o.error) { alert('Диалог: ' + o.error); return; }
  if (!o.paths || !o.paths.length) return;
  for (const x of o.paths) addInput(x);
  $('crumbs').value = o.paths[0].replace(/[\\/]+[^\\/]*$/, '') + '\\';
  browse();
}

async function pickNativeDir() {
  const r = await fetch(API + '/api/pick-dir?p=' + encodeURIComponent($('crumbs').value));
  const o = await r.json();
  if (o.error) { alert('Диалог: ' + o.error); return; }
  if (!o.path) return;
  addInput(o.path);
  $('crumbs').value = o.path;
  browse();
}

async function pickBrowser() {
  if (!window.showOpenFilePicker) { alert('Браузер не поддерживает показ файлов.\nИспользуйте кнопку «Файлы…» — системный диалог Windows.'); return; }
  const toB64 = (buf) => {
    const bytes = new Uint8Array(buf);
    let bin = '';
    const CH = 0x8000;
    for (let i = 0; i < bytes.length; i += CH) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    }
    return btoa(bin);
  };
  try {
    const hs = await window.showOpenFilePicker({
      multiple: true,
      excludeAcceptAllOption: false,
      types: [{ description: 'Lua / Luau / Text', accept: { 'text/plain': ['.lua', '.luau', '.txt'] } }],
    });
    for (const h of hs) {
      const f = await h.getFile();
      const ab = await f.arrayBuffer();
      const r = await fetch(API + '/api/upload', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name: f.name, b64: toB64(ab) }),
      });
      const o = await r.json();
      if (o.path) addInput(o.path);
    }
  } catch (e) {
    if (e && e.name !== 'AbortError') { console.error(e); alert('Ошибка выбора: ' + e); }
  }
}

/* ---------------- запуск ---------------- */

function startRun() {
  const cfg = collectSettings();
  if ((!cfg.inputs || cfg.inputs.length === 0)) {
    if (!cfg.inputText) { alert('Выберите хотя бы один файл/каталог или вставьте текст.'); return; }
  }
  $('cmdline').style.display = 'none';
  const params = new URLSearchParams({ flag: '1' });
  fetch(API + '/api/run', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(cfg) })
    .then(r => r.json())
    .then(o => {
      if (o.error) { alert(o.error); return; }
      saveSettings();
      addJobCard(o.id, o.cmdline);
      watch(o.id);
      refreshJobs();
    })
    .catch(e => alert('Ошибка запуска: ' + e));
}

function cancelActive() {
  if (state.active) fetch(API + '/api/cancel?id=' + state.active).catch(() => {});
}

async function copyCommand() {
  const cfg = collectSettings();
  const r = await fetch(API + '/api/copy-command', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(cfg) });
  const o = await r.json();
  const box = $('cmdline');
  box.textContent = o.line || o.error;
  box.style.display = 'block';
}

function openResultFolder() {
  if (state.active) {
    const j = document.querySelector('.job[data-id="' + state.active + '"]');
    if (j && j.dataset.res) { fetch(API + '/api/open?p=' + encodeURIComponent(j.dataset.res)).catch(() => {}); return; }
  }
  fetch(API + '/api/open?p=' + encodeURIComponent($('crumbs').value)).catch(() => {});
}

/* ---------------- задания и логи ---------------- */

function addJobCard(id, cmdline) {
  const wrap = $('joblist');
  const div = document.createElement('div');
  div.className = 'job';
  div.dataset.id = id;
  div.style.display = 'flex';
  const st = document.createElement('span');
  st.className = 'st running'; st.textContent = 'работа';
  const cn = document.createElement('span');
  cn.className = 'cn'; cn.textContent = cmdline;
  const tl = document.createElement('span');
  tl.className = 'tl muted'; tl.style.marginLeft = 'auto'; tl.style.flex = 'none';
  div.appendChild(st); div.appendChild(cn); div.appendChild(tl);
  div.onclick = () => selectJob(id, cmdline);
  wrap.prepend(div);
}

async function refreshJobs() {
  const r = await fetch(API + '/api/jobs');
  const o = await r.json();
  $('job-count').textContent = o.jobs.length ? o.jobs.length + ' шт.' : '';
}

function setStatus(jid, st, res) {
  const el = document.querySelector('.job[data-id="' + jid + '"]');
  if (!el) return;
  const b = el.querySelector('.st');
  b.textContent = st === 'running' ? 'работа' : st === 'done' ? 'готово' : st === 'cancelled' ? 'отменено' : st === 'no-file' ? 'нет файла' : 'ошибка';
  b.className = 'st ' + st;
  if (res) { el.dataset.res = res; }
  if (jid === state.active) renderBadge(st);
}

function activeLogID() { return state.active; }

let activeRes = null;
function renderBadge(st) {
  const b = $('state-badge');
  const map = { running: ['b-running', 'работает'], done: ['b-done', 'готово'], error: ['b-error', 'ошибка'], 'no-file': ['b-error', 'нет файла'], cancelled: ['b-cancelled', 'отменено'] };
  const [cls, txt] = map[st] || ['', st];
  b.className = 'badge ' + cls; b.textContent = txt;
}

function clearConsole() {
  $('console').innerHTML = '';
  const j = activeLogID();
  if (j) { state.seen[j] = lastJobLines; }
}

function lineCls(t) {
  if (/^> /.test(t)) return 'line-shell';
  if (/^\s*\[\+\]/.test(t)) return 'line-plus';
  if (/^\s*\[\!\]/.test(t)) return 'line-bang';
  if (/^\s*\[\*\]/.test(t)) return 'line-star';
  if (/^\s*\[i\]/.test(t)) return 'line-gear';
  return 'line-raw';
}

function appendLine(jobId, text) {
  const con = $('console');
  const div = document.createElement('div');
  div.className = lineCls(text);
  const ts = new Date().toLocaleTimeString('ru');
  const tag = document.createElement('span');
  tag.className = 'line-by'; tag.textContent = '#' + jobId + ' ' + ts + ' ';
  div.appendChild(tag);
  div.append(document.createTextNode(text));
  con.appendChild(div);
  if ($('autoscroll').checked) con.scrollTop = con.scrollHeight;
}

function watch(jobId) {
  selectJob(jobId, '');
  const esBase = new EventSource(API + '/api/events?id=' + jobId);
  const es = esBase;
  const seenKey = 'job' + jobId;
  let count = 0;
  es.onmessage = (ev) => {
    let o; try { o = JSON.parse(ev.data); } catch { return; }
    if (o.type === 'snapshot') {
      if (!state.seen[jobId]) { for (const l of o.lines) appendLine(jobId, l.text); state.seen[jobId] = o.lines.length ? o.lines[o.lines.length - 1].i + 1 : 0; }
      else {
        for (const l of o.lines) if (l.i >= state.seen[jobId]) { appendLine(jobId, l.text); state.seen[jobId] = l.i + 1; }
      }
      if (o.state !== 'running') { setStatus(jobId, o.state, o.result); renderBadge(o.state); activeRes = o.result || null; es.close(); if (state.active === jobId) renderResult(); }
    } else if (o.type === 'line') {
      if (!state.seen[jobId] || o.line.i >= state.seen[jobId]) {
        if (state.active === jobId) appendLine(jobId, o.line.text);
        state.seen[jobId] = o.line.i + 1;
      }
    } else if (o.type === 'state') {
      setStatus(jobId, o.state, o.result);
      if (state.active === jobId) { renderBadge(o.state); activeRes = o.result || null; renderResult(); }
      if (o.state !== 'running') { es.close(); }
    }
  };
  es.onerror = () => { /* автопереподключение EventSource */ };
}

function selectJob(jobId, cmd) {
  state.active = jobId;
  document.querySelectorAll('.job').forEach(el => el.classList.toggle('active', el.dataset.id === jobId));
  const j = document.querySelector('.job[data-id="' + jobId + '"]');
  $('active-name').textContent = (j && j.querySelector('.res') ? '' : '') + (cmd || (j && j.querySelector('.cn').textContent) || jobId);
  $('active-name').textContent = 'задание #' + jobId;
  $('console').innerHTML = '';
  if (state.seen[jobId]) {
    const es = new EventSource(API + '/api/events?id=' + jobId);
    es.onmessage = (ev) => {
      let o; try { o = JSON.parse(ev.data); } catch { return; }
      if (o.type === 'snapshot') {
        for (const l of o.lines) if (!state.seen[jobId] || l.i >= state.seen[jobId]) { appendLine(jobId, l.text); state.seen[jobId] = l.i + 1; }
        if (o.state !== 'running') { setStatus(jobId, o.state, o.result); renderBadge(o.state); activeRes = o.result || null; es.close(); renderResult(); }
        else renderBadge('running');
      }
    };
  }
}

function renderResult() {
  const line = $('result-line');
  if (line) {
    line.textContent = activeRes ? 'Результат: ' + activeRes : '';
    if (activeRes) {
      line.innerHTML = 'Результат: <a href="#" onclick="event.preventDefault();openRes(\'' + activeRes.replace(/'/g, '\\\'') + '\')">' + activeRes + '</a>';
    }
  }
}
function openRes(p) { fetch(API + '/api/open?p=' + encodeURIComponent(p)).catch(() => {}); }
